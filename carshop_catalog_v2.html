<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Roleplay — Araç Kataloğu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090d;
  --bg2: #11131c;
  --bg3: #181b27;
  --bg4: #1f2330;
  --border: #232838;
  --border2: #2e344a;
  --text1: #f0f2fa;
  --text2: #9097b8;
  --text3: #5a607c;
  --accent: #6c9bff;
  --accent2: #4f6dff;
  --green: #3ecf8e;
  --gold: #f4c647;
  --purple: #b47cff;
  --pink: #ff6cab;
  --red: #ff5757;
  --radius: 14px;
  --radius-sm: 8px;
  --font: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --shadow-1: 0 6px 22px rgba(0,0,0,.4);
  --shadow-2: 0 16px 48px rgba(0,0,0,.55);
  --gradient-1: linear-gradient(135deg, #6c9bff 0%, #b47cff 50%, #ff6cab 100%);
  --gradient-glow: radial-gradient(circle at top left, rgba(108,155,255,.18), transparent 60%);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Animated background blobs */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(700px 500px at 8% -10%, rgba(108,155,255,.10), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(180,124,255,.08), transparent 60%),
    radial-gradient(800px 600px at 50% 110%, rgba(62,207,142,.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 380px;
  height: 100vh;
  overflow: hidden;
}

.main-col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow: hidden;
}

@media (max-width: 1024px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .main-col { height: auto; overflow: visible; }
}

/* ---- HEADER ---- */
.header {
  background: linear-gradient(180deg, rgba(17,19,28,.95), rgba(17,19,28,.85));
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.4rem .9rem;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(14px);
  flex-shrink: 0;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: .85rem;
  flex-wrap: wrap;
}

.logo-badge {
  background: var(--gradient-1);
  color: #fff;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .12em;
  padding: 5px 10px;
  border-radius: 7px;
  text-transform: uppercase;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(108,155,255,.35);
}

.header-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  flex: 1;
  background: linear-gradient(90deg, #fff, #aab0d4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Dealer toggle pill */
.dealer-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 22px;
  padding: 6px 13px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  user-select: none;
  transition: all .2s;
  flex-shrink: 0;
}
.dealer-toggle:hover { border-color: var(--purple); color: var(--purple); transform: translateY(-1px); }
.dealer-toggle.active { border-color: var(--purple); color: var(--purple); background: rgba(180,124,255,.12); box-shadow: 0 0 0 3px rgba(180,124,255,.08); }
.dealer-toggle .toggle-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
  transition: all .2s;
}
.dealer-toggle.active .toggle-dot { background: var(--purple); box-shadow: 0 0 8px var(--purple); }

.search-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

input[type=text], select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text1);
  border-radius: var(--radius-sm);
  padding: 9px 13px;
  font-family: var(--font);
  font-size: 13px;
  outline: none;
  transition: all .2s;
}
input[type=text] { flex: 1; min-width: 200px; }
select { min-width: 140px; cursor: pointer; }
input[type=text]:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,155,255,.15);
}
input::placeholder { color: var(--text3); }

/* View toggle (grid/list) */
.view-toggle {
  display: inline-flex;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 2px;
}
.view-toggle button {
  background: transparent;
  border: none;
  color: var(--text2);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.view-toggle button:hover { color: var(--text1); }
.view-toggle button.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(108,155,255,.35); }

/* ---- TABS ---- */
.cat-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: .55rem 1.4rem .55rem;
  border-bottom: 1px solid var(--border);
  background: rgba(17,19,28,.6);
  flex-shrink: 0;
}

.tab {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 13px;
  border: 1px solid var(--border2);
  border-radius: 22px;
  cursor: pointer;
  color: var(--text2);
  background: transparent;
  transition: all .2s;
  position: relative;
}
.tab:hover { background: var(--bg3); color: var(--text1); transform: translateY(-1px); }
.tab.active {
  background: var(--gradient-1);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(108,155,255,.35);
}
.tab .count {
  font-size: 10px;
  background: rgba(0,0,0,.25);
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 5px;
}
.tab.active .count { background: rgba(255,255,255,.22); }

/* ---- BODY (scrollable) ---- */
.body-wrap {
  padding: 1.1rem 1.4rem 1.5rem;
  flex: 1;
  overflow-y: auto;
}

/* ---- STATS ---- */
.stats { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.stat {
  background: linear-gradient(180deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .6rem .95rem;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: all .2s;
}
.stat:hover { border-color: var(--border2); transform: translateY(-1px); }
.stat-val {
  font-size: 18px;
  font-weight: 800;
  color: var(--text1);
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat-label { font-size: 11px; color: var(--text3); line-height: 1; text-transform: uppercase; letter-spacing: .05em; }

/* ---- GRID ---- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.grid.list-view {
  grid-template-columns: 1fr;
  gap: 8px;
}

/* ---- CARD (grid view) ---- */
.card {
  background: linear-gradient(180deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: transform .25s cubic-bezier(.34,1.4,.64,1), border-color .2s, box-shadow .25s;
  animation: fadeUp .4s cubic-bezier(.16,1,.3,1) backwards;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  padding: 1px;
  background: var(--gradient-1);
  -webkit-mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
          mask-composite: exclude;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
  z-index: 1;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.card:hover::before { opacity: 1; }
.card.selected { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.card.selected::before { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.car-img-wrap {
  width: 100%;
  height: 130px;
  background: radial-gradient(circle at center, var(--bg4), var(--bg3));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.car-img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s cubic-bezier(.16,1,.3,1); }
.card:hover .car-img { transform: scale(1.06); }

/* speed-bar overlay on image */
.speed-pill {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(62,207,142,.3);
  color: var(--green);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 16px;
  letter-spacing: .03em;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-body { padding: .8rem; }
.card-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text1);
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}

.card-meta-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: .02em;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.badge-shop { background: rgba(108,155,255,.14); color: var(--accent); border: 1px solid rgba(108,155,255,.22); }
.badge-speed { background: rgba(62,207,142,.12); color: var(--green); border: 1px solid rgba(62,207,142,.2); }
.badge-cost { background: rgba(244,198,71,.1); color: var(--gold); border: 1px solid rgba(244,198,71,.2); }
.badge-dealer { background: rgba(180,124,255,.12); color: var(--purple); border: 1px solid rgba(180,124,255,.22); }

.dealer-cost-badge { display: none; }
.show-dealer .dealer-cost-badge { display: inline-flex; }

.color-strip { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.12);
  flex-shrink: 0;
  transition: transform .15s;
}
.dot:hover { transform: scale(1.35); z-index: 2; }

/* ---- CARD (list view) ---- */
.grid.list-view .card {
  display: grid;
  grid-template-columns: 90px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 0;
}
.grid.list-view .car-img-wrap { height: 70px; width: 90px; border-radius: var(--radius) 0 0 var(--radius); }
.grid.list-view .speed-pill { display: none; }
.grid.list-view .card-body { padding: .6rem 1rem .6rem 0; display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.grid.list-view .card-name { margin-bottom: 0; flex: 1; min-width: 0; }
.grid.list-view .card-meta-row { margin-bottom: 0; }
.grid.list-view .color-strip { padding-right: 1rem; }

/* ---- EMPTY ---- */
.empty {
  grid-column: 1/-1;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--text3);
  font-size: 14px;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }

/* ---- SIDE PANEL (monitor) ---- */
.side-panel {
  background: linear-gradient(180deg, var(--bg2), #0c0e15);
  border-left: 1px solid var(--border);
  height: 100vh;
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}
.side-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 220px;
  background: var(--gradient-glow);
  pointer-events: none;
}

@media (max-width: 1024px) {
  .side-panel {
    position: fixed;
    inset: auto 0 0 0;
    height: 78vh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1);
    z-index: 100;
    box-shadow: 0 -16px 48px rgba(0,0,0,.6);
  }
  .side-panel.open { transform: translateY(0); }
}

.panel-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  color: var(--text3);
  gap: 10px;
}
.panel-empty-icon { font-size: 48px; opacity: .35; }
.panel-empty-title { font-size: 14px; font-weight: 700; color: var(--text2); }
.panel-empty-sub { font-size: 12px; max-width: 220px; line-height: 1.5; }

.panel-content { display: none; flex-direction: column; flex: 1; }
.panel-content.show { display: flex; animation: panelIn .3s cubic-bezier(.16,1,.3,1); }
@keyframes panelIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

.panel-img-wrap { position: relative; height: 200px; background: var(--bg3); flex-shrink: 0; overflow: hidden; }
.panel-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(8,9,13,.85) 100%);
  pointer-events: none;
}
.panel-img { width: 100%; height: 100%; object-fit: cover; }
.panel-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 56px; opacity: .25; }
.panel-close {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.1);
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  z-index: 5;
}
.panel-close:hover { background: rgba(255,87,87,.7); }
@media (max-width: 1024px) { .panel-close { display: flex; } }

.panel-body { padding: 1.2rem 1.3rem 1.5rem; flex: 1; }
.panel-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.2; }
.panel-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }

.panel-meta { background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; color: var(--text2); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.panel-meta strong { color: var(--text1); font-weight: 600; }

/* cost section */
.cost-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 1.1rem;
}
.cost-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .7rem .9rem;
  position: relative;
  overflow: hidden;
}
.cost-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-glow, transparent);
  opacity: .15;
  pointer-events: none;
}
.cost-box.gold { --accent-glow: radial-gradient(circle at 100% 0%, rgba(244,198,71,.5), transparent 70%); }
.cost-box.purple { --accent-glow: radial-gradient(circle at 100% 0%, rgba(180,124,255,.5), transparent 70%); }
.cost-box-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 5px; }
.cost-box-val { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.cost-box-val.gold { color: var(--gold); }
.cost-box-val.purple { color: var(--purple); }

.dealer-cost-box { display: none; }
.show-dealer .dealer-cost-box { display: block; }

/* ---- TABLE ---- */
.section-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.id-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.id-table thead th {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: left;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--border);
}
.id-table tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
.id-table tbody tr:last-child { border-bottom: none; }
.id-table tbody tr:hover { background: rgba(255,255,255,.03); }
.id-table td { padding: 8px 4px; color: var(--text2); }

.swatch-cell { display: flex; align-items: center; gap: 9px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.18); flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.color-name { color: var(--text1); font-weight: 500; }
.id-code {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--accent);
  background: rgba(108,155,255,.1);
  border: 1px solid rgba(108,155,255,.2);
  padding: 3px 9px;
  border-radius: 5px;
  cursor: pointer;
  user-select: all;
  transition: all .15s;
  font-weight: 600;
}
.id-code:hover { background: rgba(108,155,255,.22); transform: translateY(-1px); }
.id-code.copied { background: rgba(62,207,142,.2); color: var(--green); border-color: rgba(62,207,142,.4); }
.rgb-val { font-size: 11px; color: var(--text3); font-family: 'Courier New', monospace; }

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #3a4160; }

/* mobile overlay backdrop */
.panel-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(2px);
  z-index: 99;
  opacity: 0;
  transition: opacity .25s;
}
.panel-backdrop.open { display: block; opacity: 1; }
@media (min-width: 1025px) { .panel-backdrop { display: none !important; } }

/* tooltip / copy feedback */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg4);
  border: 1px solid var(--border2);
  color: var(--text1);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-2);
  opacity: 0;
  transition: all .25s cubic-bezier(.34,1.4,.64,1);
  z-index: 300;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast::before { content: '✓'; color: var(--green); margin-right: 7px; font-weight: 800; }

/* ---- DATA STATUS ---- */
.data-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text2);
  user-select: none;
  cursor: default;
  transition: all .25s;
}
.data-status .data-status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text3);
  transition: all .25s;
}
.data-status.loading .data-status-dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.data-status.ok      { color: var(--green);  border-color: rgba(62,207,142,.35);  background: rgba(62,207,142,.08); }
.data-status.ok      .data-status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.data-status.warn    { color: var(--gold);   border-color: rgba(244,198,71,.35);  background: rgba(244,198,71,.08); cursor: pointer; }
.data-status.warn    .data-status-dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.data-status.error   { color: var(--red);    border-color: rgba(255,87,87,.35);   background: rgba(255,87,87,.08); cursor: pointer; }
.data-status.error   .data-status-dot { background: var(--red);  box-shadow: 0 0 8px var(--red);  }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .4; transform: scale(.7); }
}
</style>
</head>
<body>

<div class="app">
  <!-- MAIN COLUMN -->
  <div class="main-col">
    <!-- HEADER -->
    <div class="header">

/* ============================================================
   YARDIMCI FONKSİYONLAR
============================================================ */
function dotColor(c) {
  if (c.rgb) { const p = c.rgb.split(','); return `rgb(${p[0]},${p[1]},${p[2]})`; }
  return COLOR_HEX[c.color] || '#666';
}

function fmt(n) { return '$' + n.toLocaleString('tr-TR'); }

function applyDealerState() {
  const el = document.getElementById('dealerToggle');
  if (showDealer) {
    document.body.classList.add('show-dealer');
    el.classList.add('active');
  } else {
    document.body.classList.remove('show-dealer');
    el.classList.remove('active');
  }
}

function toggleDealer() {
  showDealer = !showDealer;
  applyDealerState();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ============================================================
   STATE
============================================================ */
let activeCat = 'all';
let activeView = 'grid';
let activeSort = 'default';
let selectedKey = null; // unique key of selected car (name + shopId)

function carKey(r) { return r.shopId + '|' + r.name; }

/* ============================================================
   TABS & FILTER
============================================================ */
function getCatCounts(shopId) {
  const counts = new Map();
  const order = [];
  RAW.forEach(r => {
    if (shopId && r.shopId !== shopId) return;
    if (!counts.has(r.cat)) { counts.set(r.cat, 0); order.push(r.cat); }
    counts.set(r.cat, counts.get(r.cat) + 1);
  });
  return order.map(c => ({ name: c, count: counts.get(c) }));
}

function buildTabs() {
  const shopId = parseInt(document.getElementById('shopFilter').value) || 0;
  const cats = getCatCounts(shopId);
  const totalCount = cats.reduce((a,c) => a + c.count, 0);
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tab' + (activeCat === 'all' ? ' active' : '');
  all.innerHTML = `Tümü <span class="count">${totalCount}</span>`;
  all.onclick = () => { activeCat = 'all'; render(); };
  tabs.appendChild(all);
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeCat === c.name ? ' active' : '');
    b.innerHTML = `${c.name} <span class="count">${c.count}</span>`;
    b.onclick = () => { activeCat = c.name; render(); };
    tabs.appendChild(b);
  });
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const shopId = parseInt(document.getElementById('shopFilter').value) || 0;
  let list = RAW.filter(r => {
    if (shopId && r.shopId !== shopId) return false;
    if (activeCat !== 'all' && r.cat !== activeCat) return false;
    if (q) {
      const idMatch = r.cars.some(c => c.id.includes(q));
      if (!r.name.toLowerCase().includes(q) && !idMatch) return false;
    }
    return true;
  });

  switch (activeSort) {
    case 'speed-desc': list = [...list].sort((a,b) => b.speed - a.speed); break;
    case 'speed-asc':  list = [...list].sort((a,b) => a.speed - b.speed); break;
    case 'cost-desc':  list = [...list].sort((a,b) => b.cost - a.cost); break;
    case 'cost-asc':   list = [...list].sort((a,b) => a.cost - b.cost); break;
    case 'name-asc':   list = [...list].sort((a,b) => a.name.localeCompare(b.name, 'tr')); break;
    case 'name-desc':  list = [...list].sort((a,b) => b.name.localeCompare(a.name, 'tr')); break;
  }
  return list;
}

/* ============================================================
   VIEW TOGGLE
============================================================ */
function setView(v) {
  activeView = v;
  document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
  document.getElementById('viewList').classList.toggle('active', v === 'list');
  document.getElementById('grid').classList.toggle('list-view', v === 'list');
}

/* ============================================================
   RENDER
============================================================ */
function render() {
  buildTabs();
  const data = filtered();
  const totalIds = data.reduce((a, r) => a + r.cars.length, 0);
  const avgCost = data.length ? Math.round(data.reduce((a,r)=>a+r.cost,0) / data.length) : 0;
  const avgSpeed = data.length ? Math.round(data.reduce((a,r)=>a+r.speed,0) / data.length) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-val">${data.length}</span><span class="stat-label">araç</span></div>
    <div class="stat"><span class="stat-val">${totalIds}</span><span class="stat-label">toplam ID</span></div>
    <div class="stat"><span class="stat-val">${new Set(data.map(r => r.cat)).size}</span><span class="stat-label">kategori</span></div>
    ${data.length ? `<div class="stat"><span class="stat-val">${fmt(avgCost)}</span><span class="stat-label">ort. fiyat</span></div>` : ''}
    ${data.length ? `<div class="stat"><span class="stat-val">${avgSpeed}</span><span class="stat-label">ort. km/s</span></div>` : ''}
  `;

  if (!data.length) {
    document.getElementById('grid').innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div>Sonuç bulunamadı</div>
      </div>`;
    return;
  }

  document.getElementById('grid').innerHTML = data.map((r, i) => {
    const isSel = selectedKey === carKey(r);
    const dotsHtml = r.cars.slice(0, 12).map(c =>
      `<div class="dot" title="${c.color} — ID: ${c.id}" style="background:${dotColor(c)}"></div>`
    ).join('') + (r.cars.length > 12 ? `<div class="dot" style="background:var(--bg4);color:var(--text3);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700">+${r.cars.length - 12}</div>` : '');
    return `
    <div class="card${isSel ? ' selected' : ''}" data-key="${carKey(r)}" style="animation-delay:${Math.min(i*22, 600)}ms" onclick="selectCar('${carKey(r).replace(/'/g, "\\'")}')">
      <div class="car-img-wrap">
        <img class="car-img" src="${r.icon}" alt="${r.name}" loading="lazy" onerror="this.style.display='none'">
        <span class="speed-pill">⚡ ${r.speed}</span>
      </div>
      <div class="card-body">
        <div class="card-name" title="${r.name}">${r.name}</div>
        <div class="card-meta-row">
          <span class="badge badge-shop">${SHOPS[r.shopId]}</span>
          <span class="badge badge-cost">${fmt(r.cost)}</span>
          ${r.dealerCost > 0 ? `<span class="badge badge-dealer dealer-cost-badge">🏪 ${fmt(r.dealerCost)}</span>` : ''}
        </div>
        <div class="color-strip">${dotsHtml}</div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   SIDE PANEL (Monitor)
============================================================ */
function selectCar(key) {
  const r = RAW.find(x => carKey(x) === key);
  if (!r) return;
  selectedKey = key;

  const mImg = document.getElementById('mImg');
  const mFb  = document.getElementById('mImgFallback');
  mImg.style.display = 'block'; mFb.style.display = 'none';
  mImg.src = r.icon;

  document.getElementById('mTitle').textContent = r.name;

  document.getElementById('mBadges').innerHTML = `
    <span class="badge badge-shop">${SHOPS[r.shopId]}</span>
    <span class="badge badge-speed">⚡ ${r.speed} km/s</span>
    <span class="badge" style="background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2)">${r.cat}</span>
  `;

  document.getElementById('mMeta').innerHTML = `
    <strong>${r.cars.length}</strong> renk seçeneği &nbsp;·&nbsp; Kategori: <strong>${r.cat}</strong>
  `;

  document.getElementById('mCost').textContent = fmt(r.cost);
  document.getElementById('mDealerCost').textContent = r.dealerCost > 0 ? fmt(r.dealerCost) : 'Yok';

  document.getElementById('mList').innerHTML = r.cars.map((c, idx) => {
    const bg = dotColor(c);
    const rgbTxt = c.rgb ? c.rgb : '—';
    return `<tr>
      <td><div class="swatch-cell">
        <div class="swatch" style="background:${bg}"></div>
        <span class="color-name">${c.color}</span>
      </div></td>
      <td><span class="id-code" data-id="${c.id}" data-idx="${idx}" onclick="copyId(this)" title="Kopyala">${c.id}</span></td>
      <td class="rgb-val">${rgbTxt}</td>
    </tr>`;
  }).join('');

  // Show panel content + on mobile, slide in
  document.getElementById('panelEmpty').style.display = 'none';
  document.getElementById('panelContent').classList.add('show');
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('panelBackdrop').classList.add('open');

  // mark selected card
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  const card = document.querySelector(`.card[data-key="${key.replace(/"/g, '\\"')}"]`);
  if (card) card.classList.add('selected');
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('panelBackdrop').classList.remove('open');
}

function copyId(el) {
  const id = el.dataset.id;
  navigator.clipboard?.writeText(id).then(() => {
    el.classList.add('copied');
    showToast('ID kopyalandı: ' + id);
    setTimeout(() => el.classList.remove('copied'), 900);
  }).catch(() => {
    showToast('Kopyalama başarısız');
  });
}

/* ============================================================

============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});
document.getElementById('shopFilter').addEventListener('change', () => { activeCat = 'all'; render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('sortFilter').addEventListener('change', e => { activeSort = e.target.value; render(); });

/* ============================================================
   XML LOADER — aynı klasördeki CarShopUI.configuration.xml dosyasını okur
============================================================ */
const XML_FILE = 'http://185.137.98.6/CarShopUI.configuration.xml';

function setDataStatus(state, text, clickable) {
  const el = document.getElementById('dataStatus');
  el.classList.remove('loading', 'ok', 'warn', 'error');
  if (state) el.classList.add(state);
  el.querySelector('.data-status-text').textContent = text;
  el.onclick = clickable ? () => document.getElementById('xmlFileInput').click() : null;
  el.title = clickable ? 'Tıkla: XML dosyasını manuel seç' : 'Veri kaynağı';
}

function parseXmlString(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('XML ayrıştırma hatası');

  const SHOP_NAME_MAP = {};
  const cats = {}; // "shopId|carName" -> categoryName
  const out = [];

  const shops = doc.querySelectorAll('Config > CarShops > CarShopName');
  shops.forEach(shop => {
    const shopId = parseInt(shop.querySelector(':scope > Id')?.textContent || '0', 10);
    const shopName = shop.querySelector(':scope > Name')?.textContent?.trim() || ('Shop ' + shopId);
    SHOP_NAME_MAP[shopId] = shopName;

    // Kategori haritası
    shop.querySelectorAll(':scope > Categories > Category').forEach(cat => {
      const catName = cat.querySelector(':scope > Name')?.textContent?.trim() || 'Diger';
      cat.querySelectorAll(':scope > CarTypeNames > CarTypeName').forEach(n => {
        cats[shopId + '|' + n.textContent.trim()] = catName;
      });
    });

    // CarType'ları topla
    shop.querySelectorAll(':scope > Cars > CarType').forEach(ct => {
      const name   = ct.querySelector(':scope > Name')?.textContent?.trim() || '';
      const icon   = ct.querySelector(':scope > IconURL')?.textContent?.trim() || '';
      const cost   = parseInt(ct.querySelector(':scope > Cost')?.textContent || '0', 10);
      const dealer = parseInt(ct.querySelector(':scope > DealercCost')?.textContent || '0', 10);
      const speed  = parseInt(ct.querySelector(':scope > TopSpeed')?.textContent || '0', 10);
      const cat    = cats[shopId + '|' + name] || 'Diger';

      const carNodes = ct.querySelectorAll(':scope > Cars > Car');
      const cars = [];
      carNodes.forEach(c => {
        const id    = c.querySelector(':scope > Id')?.textContent?.trim() || '';
        const color = c.querySelector(':scope > Color')?.textContent?.trim() || '';
        const rgb   = c.querySelector(':scope > ColorRGB')?.textContent?.trim();
        const entry = { id, color };
        if (rgb) entry.rgb = rgb;
        cars.push(entry);
      });

      out.push({ name, icon, shopId, cat, cost, dealerCost: dealer, speed, cars });
    });
  });

  return { data: out, shops: SHOP_NAME_MAP };
}

function applyParsedData(parsed) {
  RAW = parsed.data;
  // SHOPS sözlüğünü XML'den güncelle (sadece anahtar varsa)
  Object.keys(parsed.shops).forEach(k => { SHOPS[k] = parsed.shops[k]; });
  // shopFilter <option> metinlerini güncelle
  const sf = document.getElementById('shopFilter');
  Array.from(sf.options).forEach(opt => {
    const id = parseInt(opt.value, 10);
    if (id && parsed.shops[id]) opt.textContent = parsed.shops[id];
  });
  activeCat = 'all';
  selectedKey = null;
  document.getElementById('panelEmpty').style.display = '';
  document.getElementById('panelContent').classList.remove('show');
  render();
}

async function loadXmlData(manualReload) {
  setDataStatus('loading', 'XML yükleniyor…', false);
  try {
    // file:// üzerinde fetch genelde başarısız olur — yine de dene
    const url = XML_FILE + (manualReload ? ('?t=' + Date.now()) : '');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const parsed = parseXmlString(txt);
    applyParsedData(parsed);
    setDataStatus('ok', `XML: ${parsed.data.length} araç`, false);
    if (manualReload) showToast('XML yeniden yüklendi');
  } catch (err) {
    console.warn('[CarShop] XML otomatik yüklenemedi:', err);
    setDataStatus('warn', 'Gömülü veri (XML için tıkla)', true);
    if (manualReload) showToast('XML yüklenemedi: ' + err.message);
  }
}

document.getElementById('xmlFileInput').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  setDataStatus('loading', 'Dosya okunuyor…', false);
  try {
    const txt = await file.text();
    const parsed = parseXmlString(txt);
    applyParsedData(parsed);
    setDataStatus('ok', `${file.name} (${parsed.data.length} araç)`, false);
    showToast('XML yüklendi: ' + file.name);
  } catch (err) {
    setDataStatus('error', 'Hatalı XML — tekrar dene', true);
    showToast('Hata: ' + err.message);
  }
  ev.target.value = '';
});
